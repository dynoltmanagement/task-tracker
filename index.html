<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1ec79a">
<title>Dynolt Task Tracker</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script>try{if(localStorage.getItem("tt-mode")==="dark")document.documentElement.dataset.mode="dark"}catch(e){}</script>
<style>
/* Dynolt Task Tracker v3. Brand: Dynolt Green #1EC79A, Dynolt Black #1A1A1A. Font: Segoe UI (the Microsoft 365 standard), with each device's own standard font as fallback. */
:root{color-scheme:light;
  --bg:#f4f5f7;--surface:#fff;--raise:#fff;--line:#e6e8ec;--soft:#eff1f4;--hover:#f6f7f9;
  --ink:#16181c;--ink2:#3c4048;--mute:#6b7280;--faint:#9aa0aa;
  --brand:#1ec79a;--brand-ink:#0d7a5b;--brand-soft:#e4f8f1;
  --pri:#1a1a1a;--pri-ink:#fff;
  --red:#d93f3f;--red-soft:#fdecec;--red-ink:#b42318;
  --amber:#c27a00;--amber-soft:#fff3dc;--amber-ink:#8a5300;
  --orange:#d9631b;--orange-soft:#ffe8d9;--orange-ink:#a33f00;
  --blue:#3767d6;--blue-soft:#e8eefc;
  --side:#fbfbfc;--shadow:0 1px 2px #1018280d,0 1px 3px #1018281a;--shadow2:0 12px 40px #10182833;
  --r:10px}
:root[data-mode=dark]{color-scheme:dark;
  --bg:#0f1115;--surface:#171a20;--raise:#1d2129;--line:#2a2f39;--soft:#222630;--hover:#1f232b;
  --ink:#eceef2;--ink2:#c9ccd3;--mute:#9aa1ad;--faint:#6f7683;
  --brand-ink:#3fdcae;--brand-soft:#12302a;--pri:#1ec79a;--pri-ink:#0b1a14;
  --red:#f06a6a;--red-soft:#3a1d1f;--red-ink:#ff9b9b;
  --amber:#f2b544;--amber-soft:#3a2e14;--amber-ink:#f6c66b;
  --orange:#f59a52;--orange-soft:#3d2312;--orange-ink:#ffb27a;
  --blue:#8aa8f5;--blue-soft:#1c2540;--side:#13161b;--shadow:0 1px 2px #0006;--shadow2:0 12px 40px #000a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:inherit}a.btn.pri{color:var(--pri-ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.pri:hover{filter:brightness(.92)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#06281d;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:38px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:38px;padding:7px 10px;font-size:15px;width:100%}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input[type=checkbox],input[type=radio]{width:17px;height:17px;min-height:auto;accent-color:var(--brand);margin:0;flex:none}
input[type=file]{padding:6px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--mute)}
label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.sub{color:var(--mute);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--faint)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1000px 500px at 20% -10%,var(--brand-soft),transparent 60%),var(--bg)}
.lcard{width:min(410px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow2)}
.lcard .logo{height:30px;margin-bottom:24px}
.lcard h1{font-size:21px;margin-bottom:4px}
.lcard p{color:var(--mute);font-size:13.5px;margin:0 0 20px}
.lcard label.f{margin-bottom:12px}
.lcard .btn.pri{width:100%;min-height:44px;margin-top:4px}
input::-ms-reveal,input::-ms-clear{display:none}
.lerr{color:var(--red);font-size:13.5px;min-height:20px;margin-top:10px}
.lok{color:var(--brand-ink);font-size:13.5px;line-height:1.5}.lok:empty{display:none}
.lforgot{display:block;margin:-4px 0 10px auto;font-size:13px;padding:2px 0}
.linkbtn{background:none;border:0;color:var(--brand-ink);font-weight:600;font-size:13.5px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.logo-d{display:none!important}:root[data-mode=dark] .logo-l{display:none!important}:root[data-mode=dark] .logo-d{display:block!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sw,236px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.side .logo{height:22px;margin:4px 10px 22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--mute);border-radius:99px;padding:1px 8px}
.nav a.on .cnt{background:var(--surface);color:var(--brand-ink)}
.nav a .cnt.hot{background:var(--red);color:#fff}
.navlabel{font-size:11px;font-weight:600;color:var(--faint);text-transform:none;margin:16px 10px 6px}
/* Sidebar: Dynolt Black in both light and dark mode */
.side{background:#17181b;border-right:0;color:#c6c9cf}
.side .logo-l{display:none!important}.side .logo-d{display:block!important}
.side .nav a{color:#aeb2ba}.side .nav a:hover{background:#24262b;color:#fff}
.side .nav a.on{background:#24262b;color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.side .nav a.on .i{color:var(--brand)}
.side .nav a .cnt{background:#2b2e34;color:#aeb2ba}.side .nav a.on .cnt{background:#33363d;color:#fff}.side .nav a .cnt.hot{background:var(--red);color:#fff}
.side .navlabel{color:#6c717c}
.side .me{border-top-color:#2b2e34}.side .me .nm{color:#fff}.side .me .sub,.side .me .tiny{color:#8b909a}
.side .btn{background:transparent;border-color:#33363d;color:#c6c9cf}.side .btn:hover{background:#24262b}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;background:var(--soft);color:var(--ink2)}
.av.sm{width:24px;height:24px;font-size:10.5px}
.side .me .nm{font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column}
.page,.card,.stack,.kpis,.tlist,.grid2>*,.grid3>*{min-width:0}
.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:14px clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.top h1{font-size:19px}
.top .sub{display:block;margin-top:1px}
.search{position:relative;width:min(320px,34vw)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px;background:var(--surface)}
.bellw{position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.page{padding:6px clamp(14px,3vw,32px) 90px;max-width:1400px;width:100%}
.mtop,.tabbar,.fab{display:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack>*+*{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--brand)}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.15}
.kpi span{font-size:12px;color:var(--mute);font-weight:500}
.kpi.red b{color:var(--red)}.kpi.amber b{color:var(--amber)}.kpi.orange b{color:var(--orange)}.kpi.green b{color:var(--brand-ink)}
.hello{margin:6px 0 16px}
.hello h2{font-size:22px;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:34px 10px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.note.warn{border-left-color:var(--orange)}.note.err{border-left-color:var(--red)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--mute)}
.c-over{background:var(--red-soft);color:var(--red-ink)}
.c-today{background:var(--red);color:#fff}
.c-urgent{background:var(--orange-soft);color:var(--orange-ink)}
.c-soon{background:var(--amber-soft);color:var(--amber-ink)}
.c-ok{background:var(--brand-soft);color:var(--brand-ink)}
.c-await{background:var(--orange-soft);color:var(--orange-ink)}
.c-blue{background:var(--blue-soft);color:var(--blue)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ink2)}
.flag-urgent{color:var(--red);font-weight:700;font-size:11.5px;display:inline-flex;align-items:center;gap:3px;vertical-align:1px;margin-right:4px}.flag-urgent .i{width:12px;height:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- tasks list ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--mute);min-height:30px}
.seg button span{font-size:11.5px;margin-left:3px;opacity:.8}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.filters select,.filters input{width:auto;min-width:140px;flex:1 1 140px;min-height:34px;font-size:13.5px;padding:5px 8px}
.selbar{position:sticky;top:66px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pri);color:var(--pri-ink);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow2)}
.selbar b{margin-right:6px}
.selbar select,.selbar input{width:auto;min-height:32px;font-size:13px;padding:4px 8px;background:var(--surface);color:var(--ink);border-color:transparent}
.selbar .btn{min-height:32px;font-size:12.5px;background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 35%,transparent)}
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--soft);font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.ghead .sub{font-weight:500}
.trow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 150px 140px 82px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--soft);cursor:pointer}
.trow:hover{background:var(--hover)}
.trow.od{background:var(--red-soft)}
.trow.od:hover{filter:brightness(.98)}
.trow.closed .tt{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.trow.sel{background:var(--brand-soft)}
.trow .no{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.tt{font-weight:500;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--mute)}
.meta .who{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:13px;height:13px}
.upd{font-size:12.5px;color:var(--mute);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.trow select{min-height:30px;font-size:12.5px;padding:3px 6px}
.due{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:12.5px}
.ago{font-size:12px;color:var(--mute);text-align:right}
.ago.stale{color:var(--red);font-weight:600}
.thead{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 150px 140px 82px;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--faint)}
.thead span[data-sort]{cursor:pointer}.thead span[data-sort]:hover{color:var(--ink)}
.thead span:last-child{text-align:right}

/* ---------- attention list ---------- */
.alist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.alist a:hover{background:var(--hover)}
.alist a .sub{grid-column:1}
.alist h4{font-size:12px;color:var(--mute);font-weight:600;margin:14px 0 2px;display:flex;align-items:center;gap:6px}
.alist h4:first-child{margin-top:0}
.act a{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink);font-size:13px}
.act a:hover{background:var(--hover)}
.act .body{min-width:0;flex:1}
.act .body b{font-weight:600}
.act .body div{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.act a.other{box-shadow:inset 3px 0 0 var(--brand)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t td .row{flex-wrap:nowrap;white-space:nowrap}
table.t th{text-align:left;color:var(--faint);font-weight:600;font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--hover)}
.hot{color:var(--red);font-weight:700}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cal .dh{padding:8px;font-size:11.5px;font-weight:600;color:var(--faint);background:var(--soft);border-bottom:1px solid var(--line)}
.cal .day{min-height:112px;padding:6px;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);display:flex;flex-direction:column;gap:3px}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--bg);opacity:.6}
.cal .day .dn{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:2px}
.cal .day.today .dn{background:var(--brand);color:#06281d;border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.over{background:var(--red-soft);color:var(--red-ink)}
.cal .ev.soon{background:var(--amber-soft);color:var(--amber-ink)}
.cal .ev.done{text-decoration:line-through;opacity:.6}
.agenda .ad{font-weight:600;font-size:13px;margin:14px 0 6px;color:var(--mute)}
.agenda .ad.today{color:var(--brand-ink)}

/* ---------- reports ---------- */
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bars .b{width:min(22px,40%);border-radius:4px 4px 0 0;position:relative}
.bars .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--mute)}
.bars .lbl{font-size:11.5px;color:var(--mute);padding-bottom:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:10px}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--brand)}

/* ---------- people ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .hd b{font-size:15px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pstats div{background:var(--soft);border-radius:8px;padding:7px 4px}
.pstats b{display:block;font-size:18px}
.pstats span{font-size:11px;color:var(--mute)}

/* ---------- panel (task drawer) + modal ---------- */
.shade{position:fixed;inset:0;background:#0b0e1466;display:none;z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.p-open .shade{display:block}.p-open .panel{transform:none;box-shadow:var(--shadow2)}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2{font-size:15px;color:var(--mute);font-weight:600}
.pb{padding:18px;overflow-y:auto;flex:1}
.pf{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.ttl{font-size:19px;font-weight:600;border:1px solid transparent;padding:6px 8px;margin:-6px -8px 10px;width:calc(100% + 16px);min-height:auto;resize:none;background:transparent}
.ttl:hover:not(:disabled),.ttl:focus{border-color:var(--line);background:var(--surface)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pills button.on{border-color:transparent;font-weight:600}
.pills button.on[data-st="Not Started"]{background:var(--soft);color:var(--ink)}
.pills button.on[data-st="In Progress"]{background:var(--blue-soft);color:var(--blue)}

/* =================== Look v13: soft light glass =================== */
:root{
  --bg:#f2f4f7;--ink:#1f2a33;--ink2:#3d4a55;--mute:#6b7782;--faint:#9aa5af;
  --surface:rgba(255,255,255,.6);--raise:rgba(255,255,255,.86);--field:rgba(255,255,255,.78);
  --line:rgba(31,42,51,.08);--soft:rgba(31,42,51,.05);--hover:rgba(255,255,255,.55);
  --glass-edge:rgba(255,255,255,.75);--blur:saturate(170%) blur(22px);
  --brand:#2fc4a0;--brand-ink:#0f8a6c;--brand-soft:rgba(47,196,160,.14);
  --pri:#2b3640;--pri-ink:#fff;
  --red:#e0565b;--red-soft:rgba(240,122,127,.16);--red-ink:#c0393f;
  --amber:#c98a1c;--amber-soft:rgba(245,194,107,.22);--amber-ink:#94620b;
  --orange:#e07a3c;--orange-soft:rgba(240,150,100,.18);--orange-ink:#a8521f;
  --blue:#4a72d9;--blue-soft:rgba(110,145,235,.16);
  --violet-soft:rgba(169,156,245,.2);--violet-ink:#5d50c9;
  --s-od:#f07a7f;--s-soon:#f5c26b;--s-aw:#a99cf5;--s-ok:#5fd3b0;--s-nd:#c3cbd1;
  --r:20px;--shadow:0 10px 30px -18px rgba(40,52,70,.35),0 1px 2px rgba(40,52,70,.05);--shadow2:0 24px 60px -20px rgba(40,52,70,.45)}
:root[data-mode=dark]{
  --bg:#12151b;--ink:#eef1f5;--ink2:#cdd3da;--mute:#9aa4ae;--faint:#6f7a85;
  --surface:rgba(28,34,32,.5);--raise:rgba(24,30,28,.9);--field:rgba(20,24,32,.6);
  --line:rgba(255,255,255,.08);--soft:rgba(255,255,255,.06);--hover:rgba(255,255,255,.05);
  --glass-edge:rgba(255,255,255,.09);
  --brand-ink:#63e3c1;--brand-soft:rgba(47,196,160,.16);--pri:#2fc4a0;--pri-ink:#0b1f19;
  --red-soft:rgba(240,122,127,.16);--red-ink:#ff9fa3;--amber-soft:rgba(245,194,107,.15);--amber-ink:#f6cf86;
  --orange-soft:rgba(240,150,100,.15);--orange-ink:#ffb88a;--blue:#9ab3f7;--blue-soft:rgba(110,145,235,.18);
  --violet-soft:rgba(169,156,245,.18);--violet-ink:#c4bbff;--s-nd:#4c5560;
  --shadow:0 12px 30px -16px rgba(0,0,0,.6);--shadow2:0 24px 60px -20px rgba(0,0,0,.75)}
body{background:

  radial-gradient(760px 560px at 85% 110%,rgba(30,199,154,.11) 0%,transparent 62%),
  linear-gradient(160deg,#f7f9f8 0%,#f1f4f3 60%,#edf1ef 100%);background-attachment:fixed}

  radial-gradient(700px 520px at -8% -12%,rgba(30,199,154,.12) 0%,transparent 62%),

/* glass surfaces */
.card,.tlist,.kpis,.pcard,.filters,.cal,.hero,.lcard,.bcol{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
:root[data-mode=dark] .card,:root[data-mode=dark] .tlist,:root[data-mode=dark] .kpis,:root[data-mode=dark] .pcard,:root[data-mode=dark] .filters,:root[data-mode=dark] .cal,:root[data-mode=dark] .hero,:root[data-mode=dark] .lcard,:root[data-mode=dark] .bcol{border-color:var(--line)}
.card,.tlist,.kpis,.pcard,.cal{border-radius:var(--r)}
.card{padding:20px 20px 18px}
.card h2{font-size:15.5px;letter-spacing:-.005em}
.panel,.mbox,.pop,.menu .dd{background:var(--raise);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge)}
.panel{border-radius:22px 0 0 22px;border-right:0}
.pf{background:transparent}
.shade,.modal{background:rgba(40,48,60,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mbox{border-radius:22px}
.toast{border-radius:99px}

/* controls: pills and soft fields */
.btn{border-radius:99px;background:var(--field);border-color:var(--glass-edge);box-shadow:0 1px 2px rgba(40,52,70,.06)}
:root[data-mode=dark] .btn{border-color:var(--line)}
.btn:hover{background:rgba(255,255,255,.9)}
:root[data-mode=dark] .btn:hover{background:rgba(255,255,255,.08)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 8px 20px -10px rgba(43,54,64,.6)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#063226}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.icon{border-radius:50%}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(47,196,160,.18)}
input[type=checkbox],input[type=radio]{border-radius:4px}
.seg{background:var(--field);border:1px solid var(--glass-edge);border-radius:99px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
:root[data-mode=dark] .seg{border-color:var(--line)}
.seg button{border-radius:99px}
.chip{border-radius:99px}
.tag{border-radius:99px;padding:1px 9px;background:var(--soft)}
.search input{border-radius:99px}

/* shell */
.side{background:rgba(255,255,255,.32);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:1px solid var(--glass-edge);color:var(--ink2)}
:root[data-mode=dark] .side{background:rgba(18,24,22,.45);border-right-color:var(--line)}
.side .logo-l{display:block!important}.side .logo-d{display:none!important}
:root[data-mode=dark] .side .logo-l{display:none!important}:root[data-mode=dark] .side .logo-d{display:block!important}
.side .nav a{color:var(--ink2);border-radius:14px;padding:10px 12px}
.side .nav a:hover{background:rgba(255,255,255,.55);color:var(--ink)}
:root[data-mode=dark] .side .nav a:hover{background:rgba(255,255,255,.06)}
.side .nav a.on{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 8px 20px -12px rgba(40,52,70,.45)}
:root[data-mode=dark] .side .nav a.on{background:rgba(255,255,255,.1);box-shadow:none}
.side .nav a.on .i{color:var(--brand-ink)}
.side .nav a .cnt{background:var(--soft);color:var(--mute)}.side .nav a.on .cnt{background:var(--brand-soft);color:var(--brand-ink)}.side .nav a .cnt.hot{background:var(--s-od);color:#fff}
.side .navlabel{color:var(--faint)}
.side .me{border-top-color:var(--line)}.side .me .nm{color:var(--ink)}.side .me .sub,.side .me .tiny{color:var(--mute)}
.side .btn{background:var(--field);border-color:var(--glass-edge);color:var(--ink2)}.side .btn:hover{background:rgba(255,255,255,.9)}
:root[data-mode=dark] .side .btn{border-color:var(--line)}:root[data-mode=dark] .side .btn:hover{background:rgba(255,255,255,.08)}
.top{background:transparent;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top h1{font-size:23px;font-weight:600;letter-spacing:-.015em}
.top .sub:empty{display:none}
.badge{background:var(--s-od);border-color:transparent}
.av{background:rgba(255,255,255,.8)}
:root[data-mode=dark] .av{background:rgba(255,255,255,.1)}
@media(max-width:860px){
  .mtop,.tabbar{background:rgba(255,255,255,.6);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-color:var(--glass-edge)}
  :root[data-mode=dark] .mtop,:root[data-mode=dark] .tabbar{background:rgba(20,24,32,.6);border-color:var(--line)}
  .tabbar a.on{color:var(--brand-ink)}
  .fab{background:linear-gradient(135deg,#46d3ad,#2fb59c);color:#fff;box-shadow:0 12px 26px -8px rgba(47,196,160,.7)}
}

/* Today hero: soft glass */
.hero{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,2fr);gap:32px;border-radius:24px;padding:26px 28px 20px;margin:4px 0 18px;color:var(--ink)}
.hclock{font-size:46px;font-weight:300;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.hdate{color:var(--mute);margin-top:9px;font-size:13.5px}
.hsum{margin:20px 0 0;font-size:15px;line-height:1.5;color:var(--ink2);max-width:34ch}
.chg{display:flex;gap:3px;height:12px;align-items:stretch;padding:3px;border-radius:99px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 2px rgba(40,52,70,.08)}
:root[data-mode=dark] .chg{background:rgba(255,255,255,.06)}
.chg i{flex:1 1 0;min-width:3px;border-radius:99px}
.chg .s-od{background:var(--s-od)}.chg .s-soon{background:var(--s-soon)}.chg .s-aw{background:var(--s-aw)}.chg .s-ok{background:var(--s-ok)}.chg .s-nd{background:var(--s-nd)}
.chg.empty i{background:var(--soft)}
.chgcap{font-size:12px;color:var(--mute);margin:10px 0 14px}
.reads{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.read{background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);border-radius:16px;color:inherit;text-align:left;padding:12px 14px;transition:background .15s,transform .15s}
:root[data-mode=dark] .read{background:rgba(255,255,255,.05);border-color:var(--line)}
.read:hover{background:rgba(255,255,255,.9)}
:root[data-mode=dark] .read:hover{background:rgba(255,255,255,.1)}
.read b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.read span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:5px;line-height:1.3}
.read.red b{color:var(--red)}.read.amber b{color:var(--amber)}.read.orange b{color:var(--orange)}.read.green b{color:var(--brand-ink)}
.read[data-i="3"] b{color:var(--violet-ink)}
.read:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sw{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.sw.s-od{background:var(--s-od)}.sw.s-soon{background:var(--s-soon)}.sw.s-aw{background:var(--s-aw)}
@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1fr);gap:20px}.reads{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){.hero{padding:20px 18px 18px;border-radius:22px;margin-top:0}.hclock{font-size:38px}.hsum{margin-top:14px;font-size:14.5px}.read{padding:10px 12px}.read b{font-size:22px}}

/* task list and board: soft urgency strip */
.trow{position:relative;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line)}
.thead{padding-left:20px}
.trow::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:4px;border-radius:99px;background:var(--rail,transparent)}
.trow[data-u=od]{--rail:var(--s-od)}.trow[data-u=soon]{--rail:var(--s-soon)}.trow[data-u=aw]{--rail:var(--s-aw)}.trow[data-u=ok]{--rail:var(--s-ok)}.trow[data-u=nd]{--rail:var(--s-nd)}
.trow:hover,.trow.od:hover{background:rgba(255,255,255,.5);filter:none}
:root[data-mode=dark] .trow:hover,:root[data-mode=dark] .trow.od:hover{background:rgba(255,255,255,.04)}
.trow.od{background:none}
.trow.sel,.trow.sel:hover{background:var(--brand-soft)}
.ghead{background:rgba(255,255,255,.35)}
:root[data-mode=dark] .ghead{background:rgba(255,255,255,.04)}
.trow select[data-st]{border-radius:99px;border-color:transparent;font-weight:600;padding-left:12px}
.trow select[data-st="Not Started"]{background-color:var(--soft);color:var(--ink2)}
.trow select[data-st="In Progress"]{background-color:var(--blue-soft);color:var(--blue)}
.trow select[data-st="On Hold"]{background-color:var(--amber-soft);color:var(--amber-ink)}
.trow select[data-st="Completed"]{background-color:var(--brand-soft);color:var(--brand-ink)}
.trow select[data-st="Dropped"]{background-color:var(--red-soft);color:var(--red-ink)}
.c-await{background:var(--violet-soft);color:var(--violet-ink)}
.c-today{background:var(--s-od);color:#fff}
.bcol{border-radius:22px}
.bcol.over{background:var(--brand-soft);border-color:var(--brand)}
.bcard{background:rgba(255,255,255,.75);border:1px solid var(--glass-edge);border-radius:16px;position:relative;padding-left:18px;box-shadow:0 6px 16px -12px rgba(40,52,70,.4)}
:root[data-mode=dark] .bcard{background:rgba(255,255,255,.05);border-color:var(--line)}
.bcard::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:4px;border-radius:99px;background:var(--rail,transparent)}
.bcard[data-u=od]{--rail:var(--s-od)}.bcard[data-u=soon]{--rail:var(--s-soon)}.bcard[data-u=aw]{--rail:var(--s-aw)}.bcard[data-u=ok]{--rail:var(--s-ok)}
.bcard.od{border-left:1px solid var(--glass-edge)}

/* report figures: one glass strip */
.kpis{gap:0;overflow:hidden}
.kpi{border:0;border-radius:0;box-shadow:none;background:transparent;padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi:hover{background:rgba(255,255,255,.45)}
.kpi b{font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:1100px){.kpi:nth-child(3n+1){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:860px){.kpi:nth-child(3n+1){border-left:1px solid var(--line)}.kpi:nth-child(2n+1){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.pstats div{background:var(--soft);border-radius:14px}
.cal .dh{background:rgba(255,255,255,.35)}
.cal .day.out{background:transparent;opacity:.5}
.cal .ev{border-radius:99px;padding:2px 8px}
.sec.acc,.note{border-radius:16px}
.note{background:var(--surface)}

/* sign-in: glass card on the soft background */
.login{background:transparent}
.lcard{border-radius:28px;padding:36px 32px}
.lcard .btn.pri{min-height:46px}

/* glass highlight: light catches the top edge of each pane */
.card,.tlist,.kpis,.pcard,.filters,.cal,.hero,.lcard,.bcol{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),var(--shadow)}
:root[data-mode=dark] .card,:root[data-mode=dark] .tlist,:root[data-mode=dark] .kpis,:root[data-mode=dark] .pcard,:root[data-mode=dark] .filters,:root[data-mode=dark] .cal,:root[data-mode=dark] .hero,:root[data-mode=dark] .lcard,:root[data-mode=dark] .bcol{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--shadow)}
:root{--shadow:0 16px 40px -22px rgba(30,45,40,.32),0 1px 2px rgba(30,45,40,.06);--shadow2:0 28px 70px -24px rgba(30,45,40,.42);--pri:#1a1a1a}
:root[data-mode=dark] .chg{background:rgba(255,255,255,.06)}
.shade,.modal{background:rgba(20,28,26,.22)}

/* glass only where it helps: sidebar, top bar, Today panel, drawer, dialogs, sign-in. Working areas stay solid. */
:root{--solid:#ffffff}
:root[data-mode=dark]{--solid:#1a1f1e}
.card,.tlist,.kpis,.pcard,.filters,.cal,.bcol{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:var(--shadow)}
:root[data-mode=dark] .card,:root[data-mode=dark] .tlist,:root[data-mode=dark] .kpis,:root[data-mode=dark] .pcard,:root[data-mode=dark] .filters,:root[data-mode=dark] .cal,:root[data-mode=dark] .bcol{box-shadow:var(--shadow)}
.bcol{background:#f6f8f7}:root[data-mode=dark] .bcol{background:#161a19}
.bcard{background:var(--solid)}:root[data-mode=dark] .bcard{background:#20262a}
.ghead,.cal .dh{background:#f6f8f7}:root[data-mode=dark] .ghead,:root[data-mode=dark] .cal .dh{background:#20262a}
.trow:hover,.trow.od:hover{background:#f7f9f8}:root[data-mode=dark] .trow:hover,:root[data-mode=dark] .trow.od:hover{background:#20262a}
.kpi:hover{background:#f7f9f8}:root[data-mode=dark] .kpi:hover{background:#20262a}

/* real glass: clear panes over two soft brand orbs (Dynolt green and Dynolt black) */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none}
body::before{width:460px;height:460px;top:-150px;right:6%;background:radial-gradient(circle at 32% 30%,#9cf0d6 0%,#2fd0a5 38%,#13a983 68%,#0d8a6b 100%);opacity:.55;filter:blur(2px)}
body::after{width:380px;height:380px;bottom:-140px;left:-90px;background:radial-gradient(circle at 34% 30%,#6b6f73 0%,#2a2c2e 45%,#121314 100%);opacity:.5;filter:blur(2px)}
:root[data-mode=dark] body::before{opacity:.38}
:root[data-mode=dark] body::after{background:radial-gradient(circle at 34% 30%,#2fd0a5 0%,#0f8a6b 55%,#0a3e31 100%);opacity:.3}
@media(max-width:860px){body::before{width:300px;height:300px;top:40px;right:-90px}body::after{width:260px;height:260px;bottom:60px;left:-110px}}
.glass,.side,.top,.hero,.lcard,.panel,.mbox,.pop,.menu .dd{
  background:linear-gradient(135deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.12) 100%)!important;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18),0 20px 44px -24px rgba(25,40,35,.35)}
.top{border:0;border-bottom:1px solid rgba(255,255,255,.45);box-shadow:none}
.side{border-width:0 1px 0 0}
.panel,.mbox,.pop,.menu .dd{background:linear-gradient(135deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.55) 100%)!important}
:root[data-mode=dark] .side,:root[data-mode=dark] .top,:root[data-mode=dark] .hero,:root[data-mode=dark] .lcard,:root[data-mode=dark] .panel,:root[data-mode=dark] .mbox,:root[data-mode=dark] .pop,:root[data-mode=dark] .menu .dd{
  background:linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%)!important;border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 44px -24px rgba(0,0,0,.7)}
:root[data-mode=dark] .panel,:root[data-mode=dark] .mbox,:root[data-mode=dark] .pop,:root[data-mode=dark] .menu .dd{background:linear-gradient(135deg,rgba(28,34,33,.86) 0%,rgba(22,27,26,.8) 100%)!important}
.read{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.read:hover{background:rgba(255,255,255,.55)}
.chg{background:rgba(255,255,255,.35)}
@media(max-width:860px){
  .mtop,.tabbar{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.18))!important;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-color:rgba(255,255,255,.55)}
  :root[data-mode=dark] .mtop,:root[data-mode=dark] .tabbar{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03))!important;border-color:rgba(255,255,255,.12)}
}

/* sign-in: orbs sit partly behind the card so the glass reads */
body:has(#login:not([hidden]))::before,body:has(#login:not([hidden]))::after{display:none}
.login{position:relative;overflow:hidden;isolation:isolate}
.login::before,.login::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.login::before{width:340px;height:340px;left:calc(50% + 70px);top:calc(50% - 330px);background:radial-gradient(circle at 32% 30%,#9cf0d6 0%,#2fd0a5 38%,#13a983 68%,#0d8a6b 100%);opacity:.75}
.login::after{width:280px;height:280px;left:calc(50% - 360px);top:calc(50% + 40px);background:radial-gradient(circle at 34% 30%,#6b6f73 0%,#2a2c2e 45%,#121314 100%);opacity:.7}
:root[data-mode=dark] .login::after{background:radial-gradient(circle at 34% 30%,#2fd0a5 0%,#0f8a6b 55%,#0a3e31 100%);opacity:.45}
@media(max-width:860px){.login::before{width:240px;height:240px;left:auto;right:-60px;top:calc(50% - 360px)}.login::after{width:200px;height:200px;left:-70px;top:calc(50% + 180px)}}

input:focus,select:focus,textarea:focus{border-color:var(--brand)!important;box-shadow:0 0 0 4px rgba(47,196,160,.18)!important}
.trow select[data-st]{border-color:transparent!important}
.trow select[data-st="Not Started"]{background-color:rgba(255,255,255,.6)!important}
.trow select[data-st="In Progress"]{background-color:var(--blue-soft)!important}
.trow select[data-st="On Hold"]{background-color:var(--amber-soft)!important}
.trow select[data-st="Completed"]{background-color:var(--brand-soft)!important}
.trow select[data-st="Dropped"]{background-color:var(--red-soft)!important}
.read{background:rgba(255,255,255,.3)!important;border:1px solid rgba(255,255,255,.75)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important}
.side .nav a.on{background:rgba(255,255,255,.7)!important;box-shadow:inset 0 1px 0 #fff,0 8px 20px -12px rgba(20,50,42,.4)!important}
:root[data-mode=dark] .card,:root[data-mode=dark] .kpis,:root[data-mode=dark] .pcard,:root[data-mode=dark] .bcol,:root[data-mode=dark] .filters,:root[data-mode=dark] .tlist,:root[data-mode=dark] .cal,:root[data-mode=dark] .hero,:root[data-mode=dark] .lcard,:root[data-mode=dark] .side,:root[data-mode=dark] .top{
  background:linear-gradient(140deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 60%,rgba(255,255,255,.06) 100%)!important;
  border-color:rgba(255,255,255,.12)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 48px -26px rgba(0,0,0,.7)!important}

:root[data-mode=dark] .bcard{background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.1)!important}
:root[data-mode=dark] input,:root[data-mode=dark] select,:root[data-mode=dark] textarea{background:rgba(0,0,0,.25)!important;border-color:rgba(255,255,255,.1)!important}
:root[data-mode=dark] .read{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)!important;box-shadow:none!important}
:root[data-mode=dark] .ghead,:root[data-mode=dark] .cal .dh{background:rgba(255,255,255,.04)!important}
:root[data-mode=dark] .side .nav a.on{background:rgba(255,255,255,.1)!important;box-shadow:none!important}

@media(max-width:860px){.mtop,.tabbar{background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.28))!important;-webkit-backdrop-filter:blur(22px) saturate(185%)!important;backdrop-filter:blur(22px) saturate(185%)!important}}

/* phone: figures as separate glass tiles, no grid lines */
@media(max-width:860px){
  .kpis{gap:10px!important;background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;overflow:visible!important}
  .kpi,.kpi:nth-child(n){border:1px solid rgba(255,255,255,.7)!important;border-radius:16px!important;
    background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.28))!important;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 28px -20px rgba(20,50,42,.4)!important}
  :root[data-mode=dark] .kpi,:root[data-mode=dark] .kpi:nth-child(n){border-color:rgba(255,255,255,.1)!important;background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.03))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)!important}
}

/* v37: one Dynolt scene per tab behind the glass, and clearer glass */
body{--pg3d:var(--iso-charger);--pg3d2:var(--iso-chart)}
body[data-page=tasks]{--pg3d:var(--iso-board);--pg3d2:var(--iso-charger)}
body[data-page=calendar]{--pg3d:var(--iso-calendar);--pg3d2:var(--iso-chart)}
body[data-page=reports]{--pg3d:var(--iso-chart);--pg3d2:var(--iso-battery)}
body[data-page=team]{--pg3d:var(--iso-battery);--pg3d2:var(--iso-board)}
body[data-page=templates],body[data-page=settings],body[data-page=accounts],body[data-page=more]{--pg3d:var(--iso-charger);--pg3d2:var(--iso-calendar)}
.hero::before{display:none!important}
body::before,body::after{display:block!important;content:"";position:fixed;z-index:-1;pointer-events:none;transform:none!important;filter:none!important;border-radius:0!important;
  background-color:transparent!important;background-repeat:no-repeat!important;background-size:contain!important;background-position:center!important;opacity:1!important}
body::before{width:560px;height:520px;top:70px;right:-10px;left:auto;bottom:auto;background-image:var(--pg3d)!important}
body::after{width:440px;height:380px;bottom:-10px;left:250px;right:auto;top:auto;background-image:var(--pg3d2)!important}
.shell.mini~*{}
:root[data-mode=dark] body::before,:root[data-mode=dark] body::after{opacity:.5!important}
@media(max-width:860px){body::before{width:330px;height:300px;top:90px;right:-60px}body::after{width:280px;height:240px;bottom:80px;left:-50px}}
body:has(#login:not([hidden]))::before,body:has(#login:not([hidden]))::after{display:none!important}
/* clearer glass: lower fill, lighter frost, crisp light edges */
.card,.kpis,.pcard,.bcol,.filters,.tlist,.cal,.hero,.side,.top{
  background:linear-gradient(140deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.10) 55%,rgba(255,255,255,.20) 100%)!important;
  -webkit-backdrop-filter:blur(9px) saturate(170%)!important;backdrop-filter:blur(9px) saturate(170%)!important}
.lcard{background:linear-gradient(140deg,rgba(255,255,255,.40) 0%,rgba(255,255,255,.14) 60%,rgba(255,255,255,.24) 100%)!important;-webkit-backdrop-filter:blur(8px) saturate(170%)!important;backdrop-filter:blur(8px) saturate(170%)!important}
.read{background:rgba(255,255,255,.18)!important}
.bcard{background:rgba(255,255,255,.45)!important}
input,select,textarea{background:rgba(255,255,255,.45)!important}
@media(max-width:860px){.kpi,.kpi:nth-child(n){background:linear-gradient(140deg,rgba(255,255,255,.36),rgba(255,255,255,.12))!important;-webkit-backdrop-filter:blur(9px) saturate(170%)!important;backdrop-filter:blur(9px) saturate(170%)!important}
  .mtop,.tabbar{background:linear-gradient(140deg,rgba(255,255,255,.4),rgba(255,255,255,.16))!important;-webkit-backdrop-filter:blur(10px) saturate(170%)!important;backdrop-filter:blur(10px) saturate(170%)!important}}
:root[data-mode=dark] .card,:root[data-mode=dark] .kpis,:root[data-mode=dark] .pcard,:root[data-mode=dark] .bcol,:root[data-mode=dark] .filters,:root[data-mode=dark] .tlist,:root[data-mode=dark] .cal,:root[data-mode=dark] .hero,:root[data-mode=dark] .side,:root[data-mode=dark] .top{
  background:linear-gradient(140deg,rgba(255,255,255,.07) 0%,rgba(20,24,23,.35) 60%,rgba(255,255,255,.05) 100%)!important}

body::before,body::after{opacity:.8!important}
:root[data-mode=dark] body::before,:root[data-mode=dark] body::after{opacity:.45!important}

/* teams and colleague suggestions */
.teamchk{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:4px}
.teamchk input#p-newteam{flex:1 1 200px;min-width:180px;width:auto}
.teamchk .chk{font-weight:500;color:var(--ink2)}
.sglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.sgi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
:root[data-mode=dark] .sgi{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.sgi .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teambar{flex-wrap:wrap}
.tseg{flex-wrap:wrap;max-width:100%}

.pop .sglist.pops{grid-template-columns:1fr;gap:6px;padding:2px 6px 6px}

<body>
<section class="login" id="login" hidden>
  <div class="lart la1" aria-hidden="true"></div><div class="lart la2" aria-hidden="true"></div><div class="lart la3" aria-hidden="true"></div>
  <form class="lcard" id="lform" autocomplete="on">
    <img class="logo logo-l" src="logo.png" alt="Dynolt"><img class="logo logo-d" src="logo-dark.png" alt="Dynolt">
    <h1 id="ltitle">Task Tracker</h1>
    <p id="lintro">Sign in to your private team tracker.</p>
    <label class="f" id="lname-wrap" hidden>Your name<input id="lname" autocomplete="name"></label>
    <label class="f" id="lemail-wrap">Email<input type="email" id="lemail" autocomplete="username" required></label>
    <label class="f" id="lpass-wrap"><span id="lpass-lbl">Password</span><input type="password" id="lpass" autocomplete="current-password" required></label>
    <label class="f" id="lpass2-wrap" hidden>Repeat new password<input type="password" id="lpass2" autocomplete="new-password"></label>
    <button type="button" class="linkbtn lforgot" id="lforgot">Forgot password?</button>
    <button class="btn pri" id="lbtn" type="submit">Sign in</button>
    <div class="lerr" id="lerr" role="alert"></div>
    <div class="lok" id="lok" role="status"></div>
    <button type="button" class="linkbtn" id="lswitch">New here? Create an account</button>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn icon ghost mode" aria-label="Dark mode"></button></div>
  </form>
</section>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="shead"><img class="logo logo-l" src="logo.png" alt="Dynolt"><img class="logo logo-d" src="logo-dark.png" alt="Dynolt"><img class="logo-m" src="icon.png" alt="Dynolt"><button class="btn icon ghost sbtn" data-act="sidemini" aria-label="Collapse sidebar" title="Collapse sidebar"></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="sideart" aria-hidden="true"></div>
    <div class="me"><div class="av" id="meav"></div><div class="who2"><div class="nm" id="menm"></div><div class="tiny" id="meem"></div></div><button class="btn icon ghost mode" aria-label="Dark mode"></button></div>
    <div class="sgrip" title="Drag to resize. Double-click to reset." aria-hidden="true"></div>
  </aside>
  <div class="main">
    <div class="mtop"><img class="logo logo-l" src="logo.png" alt="Dynolt"><img class="logo logo-d" src="logo-dark.png" alt="Dynolt"><span class="grow"></span><button class="btn icon ghost mode" aria-label="Dark mode"></button><div class="bellw"><button class="btn icon ghost" data-act="bell" aria-label="Notifications"></button><span class="badge" data-badge hidden></span></div></div>
    <header class="top">
      <div class="grow"><h1 id="ptitle"></h1><span class="sub" id="psub"></span></div>
      <label class="search"><span class="sr" hidden>Search</span><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search tasks  (press /)"></label>
      <div class="bellw"><button class="btn icon" data-act="bell" aria-label="Notifications"></button><span class="badge" data-badge hidden></span><div id="pop"></div></div>
      <button class="btn pri" id="add"></button>
    </header>
    <main class="page" id="page"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" id="fab" aria-label="New task"></button>
</div>

<div class="shade" id="shade"></div>
<aside class="panel" id="panel" aria-label="Task">
  <div class="ph"><h2 id="pt">Task</h2><span class="grow"></span><button class="btn icon ghost" id="px" aria-label="Close"></button></div>
  <div class="pb" id="pb"></div>
  <div class="pf" id="pfoot"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox"><div class="ph"><h2 id="mt" style="color:var(--ink);font-size:16px"></h2><span class="grow"></span><button class="btn icon ghost" id="mx" aria-label="Close"></button></div><div class="pb" id="mb"></div><div class="pf" id="mf"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
